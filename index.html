<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حسابات سيد حسين عطيه الموسوي</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #050508;
            color: #ffffff;
            padding: 15px 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Banner Header */
        .header-card {
            background: linear-gradient(135deg, rgba(88, 28, 135, 0.2), rgba(219, 39, 119, 0.2));
            border: 2px solid #a855f7;
            border-radius: 16px;
            padding: 16px;
            text-align: center;
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.35);
        }
        .header-title {
            color: #ec4899;
            font-size: 1.25rem;
            font-weight: bold;
            margin-bottom: 4px;
        }
        .header-subtitle {
            color: #cbd5e1;
            font-size: 0.85rem;
            margin-bottom: 6px;
        }
        .header-name {
            color: #facc15;
            font-size: 1.15rem;
            font-weight: bold;
            text-shadow: 0 0 8px rgba(250, 204, 21, 0.4);
        }

        /* Single Account Card */
        .card {
            background: #0b0c12;
            border-radius: 12px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .border-green { border: 2px solid #22c55e; box-shadow: 0 0 12px rgba(34, 197, 94, 0.25); }
